spring:
  application:
    name: distribuciones-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/londono_distribuciones}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway es la unica fuente de verdad del esquema; Hibernate nunca lo modifica.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # Tope de la capa HTTP; la validacion de negocio vive en app.cloudinary.max-file-size-mb.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Configuracion propia de la aplicacion (toda via variables de entorno; sin secretos en el repo).
app:
  security:
    jwt:
      # IMPORTANTE: en produccion JWT_SECRET debe tener >= 32 caracteres (256 bits para HS256).
      secret: ${JWT_SECRET:change-me-in-env-this-is-a-dev-only-secret-string-32+}
      # Milisegundos.
      access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutos
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 dias
      issuer: londono-distribuciones
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-folder: ${CLOUDINARY_UPLOAD_FOLDER:londono/products}
    max-file-size-mb: ${CLOUDINARY_MAX_FILE_SIZE_MB:5}
  contact:
    whatsapp-phone-number: ${WHATSAPP_PHONE_NUMBER:}
  # Seed del administrador inicial (solo se crea si la tabla users esta vacia).
  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:true}
    name: ${ADMIN_SEED_NAME:Administrador}
    email: ${ADMIN_SEED_EMAIL:admin@londono.local}
    password: ${ADMIN_SEED_PASSWORD:ChangeMe123!}

logging:
  level:
    org.flywaydb: INFO
    org.springframework.security: INFO
